<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wyatt Voigt</title>
<meta name="description" content="Wyatt Voigt — Computer Engineering at Texas A&M, class of 2027.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --umber: #120d09;
    --umber-2: #241a12;
    --gold-hi: #f6e9c8;
    --gold: #cdb07a;
    --gold-lo: #8b6f43;
    --glass: #16130f;
    --panel: #1f1b16;
    --line: rgba(240, 223, 184, 0.12);
    --amber: #f3b544;
    --text: #efe5d0;
    --muted: #9b8f7a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--umber);
    color: var(--text);
    font-family: 'Sora', system-ui, sans-serif;
  }
  #fibers { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .corner {
    position: fixed;
    z-index: 2;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  .corner.tl { top: 24px; left: 28px; }
  .corner.tl strong { display: block; color: var(--text); font-weight: 600; font-size: 15px; letter-spacing: 0.2px; }
  .corner.br { bottom: 22px; right: 28px; text-align: right; }
  kbd {
    font-family: inherit;
    font-size: 11px;
    color: var(--text);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 6px;
    margin: 0 1px;
    background: rgba(255, 255, 255, 0.03);
  }

  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    perspective: 1600px;
    z-index: 1;
  }
  .tilt {
    transform-style: preserve-3d;
    transform: scale(var(--s, 1)) rotateY(var(--ry, -16deg)) rotateX(var(--rx, 5deg)) rotateZ(-1.5deg);
    transition: transform 600ms cubic-bezier(.2,.7,.2,1), opacity 400ms ease;
  }

  /* ---------- the device ---------- */
  .device {
    position: relative;
    width: 360px;
    height: 600px;
    border-radius: 22px 22px 78px 22px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, rgba(0,0,0,0.04) 1px 3px),
      linear-gradient(150deg, #fbf0d2 0%, #d8bf8c 28%, #b39561 55%, #cfb380 78%, #8f7448 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.85),
      inset 1px 0 0 rgba(255,255,255,0.5),
      inset 0 -3px 6px rgba(70,50,20,0.35),
      1px 1px 0 #b09160, 2px 2px 0 #a6875a, 3px 3px 0 #9b7e52, 4px 4px 0 #91744b,
      5px 5px 0 #866a43, 6px 6px 0 #7b613c, 7px 7px 0 #6f5735, 8px 8px 0 #5f4a2d,
      40px 50px 80px rgba(0,0,0,0.65),
      0 0 120px rgba(243,181,68,0.10);
  }

  .power {
    position: absolute; top: 14px; left: 24px;
    display: flex; align-items: center; gap: 7px;
    font-size: 8.5px; letter-spacing: 1.2px; color: #5c4729;
  }
  .power i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 6px var(--amber), 0 0 14px rgba(243,181,68,0.7);
  }

  .bezel {
    position: absolute;
    top: 34px; left: 22px; right: 22px;
    height: 284px;
    border-radius: 16px 16px 40px 16px;
    background: linear-gradient(180deg, #2a241d, #120f0c);
    padding: 22px 14px 14px;
    box-shadow:
      inset 0 2px 3px rgba(0,0,0,0.8),
      0 1px 0 rgba(255,255,255,0.6),
      0 -1px 0 rgba(90,65,30,0.5);
  }
  /* the classic twin stripe across the top of the bezel */
  .bezel::before {
    content: "";
    position: absolute; top: 9px; left: 14px; right: 14px; height: 6px;
    background:
      linear-gradient(90deg, #8b6f43, #cdb07a) 0 0 / 100% 2px no-repeat,
      linear-gradient(90deg, #6b3f1a, var(--amber)) 0 4px / 100% 2px no-repeat;
    opacity: 0.8;
  }
  .batt { display: flex; align-items: center; gap: 2px; }
  .batt i { width: 4px; height: 8px; border-radius: 1px; background: var(--amber); box-shadow: 0 0 4px rgba(243,181,68,0.6); }
  .batt i:last-child { background: rgba(240,223,184,0.15); box-shadow: none; }
  .screen {
    position: relative;
    height: 100%;
    border-radius: 10px 10px 30px 10px;
    background: radial-gradient(120% 80% at 20% 0%, #26211b 0%, var(--glass) 60%);
    border: 1px solid rgba(205,176,122,0.22);
    overflow: hidden;
    padding: 12px 13px 10px;
    display: flex;
    flex-direction: column;
  }
  .screen::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(115deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 32%);
    pointer-events: none;
  }

  .scr-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .scr-title { font-size: 17px; font-weight: 600; letter-spacing: 0.1px; line-height: 1.1; }
  .scr-sub { font-size: 9.5px; color: var(--muted); margin-top: 3px; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 9px; color: var(--text);
    border: 1px solid rgba(243,181,68,0.35);
    border-radius: 6px;
    padding: 3px 7px;
    background: rgba(243,181,68,0.06);
    white-space: nowrap;
  }
  .pill i { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  .scr-body { flex: 1; display: grid; grid-template-columns: 1fr 104px; gap: 9px; margin-top: 10px; min-height: 0; }
  .menu {
    list-style: none; margin: 0; padding: 4px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .menu li {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px;
    height: 20px;
    padding: 0 8px;
    border-radius: 5px;
    color: var(--muted);
    cursor: pointer;
  }
  .menu li .ext { font-size: 9px; opacity: 0.6; }
  .menu li.sel { color: var(--text); background: rgba(243,181,68,0.1); }
  .menu li.sel::before {
    content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 2px;
    background: var(--amber); border-radius: 2px; box-shadow: 0 0 6px var(--amber);
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 8px 7px;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }
  .stat-label { font-size: 8.5px; color: var(--muted); align-self: flex-start; }
  .ring { position: relative; width: 66px; height: 66px; margin: 6px 0 4px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 600; }
  .stat-foot { font-size: 8.5px; color: var(--muted); line-height: 1.4; }
  .stat-foot b { color: var(--text); font-weight: 600; display: block; }
  .spark { width: 100%; height: 22px; margin-top: 6px; }

  .scr-hint {
    margin-top: 8px;
    display: flex; align-items: center; gap: 6px;
    font-size: 9px; color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 6px;
    min-height: 20px;
  }
  .scr-hint svg { flex: none; }

  /* boot */
  .boot {
    position: absolute; inset: 0; z-index: 3;
    background: var(--glass);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5px;
    animation: flicker 900ms steps(1, end) forwards;
    cursor: pointer;
  }
  .boot.hide { animation: none; opacity: 0; transition: opacity 400ms ease-in; pointer-events: none; }
  .boot .b1 { font-size: 9px; color: var(--muted); letter-spacing: 0.4px; }
  .boot .b2 { font-size: 16px; font-weight: 600; }
  .boot .b3 { font-size: 11px; color: var(--amber); }
  .boot .bar { width: 120px; height: 2px; background: var(--line); border-radius: 2px; margin-top: 12px; overflow: hidden; }
  .boot .bar i { display: block; height: 100%; width: 0; background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: load 1.5s ease-out forwards; }
  @keyframes load { to { width: 100%; } }
  @keyframes flicker {
    0% { opacity: 0; } 8% { opacity: 0.6; } 16% { opacity: 0.05; }
    24% { opacity: 0.8; } 32% { opacity: 0.15; } 45%, 100% { opacity: 1; }
  }
  .flash { position: absolute; inset: 0; z-index: 4; background: #fff2d6; opacity: 0; pointer-events: none; }

  /* engraved wordmark */
  .mark {
    position: absolute; top: 330px; left: 30px;
    font-size: 13px; font-weight: 700; font-style: italic; letter-spacing: 0.4px;
    color: #8f7244;
    text-shadow: 0 1px 0 rgba(255,255,255,0.65), 0 -1px 0 rgba(70,50,20,0.45);
  }
  .mark span { font-weight: 300; }

  /* controls */
  .dpad { position: absolute; left: 42px; top: 386px; width: 104px; height: 104px; }
  .dpad .cross {
    position: absolute; inset: 0;
    filter: drop-shadow(0 3px 2px rgba(40,25,5,0.55));
    transition: transform 80ms ease-out;
  }
  .dpad .cross::before, .dpad .cross::after {
    content: ""; position: absolute;
    background: linear-gradient(145deg, #3a332b, #15120f);
    border-radius: 6px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
  }
  .dpad .cross::before { left: 35px; width: 34px; top: 0; height: 104px; }
  .dpad .cross::after { top: 35px; height: 34px; left: 0; width: 104px; }
  .dpad .hub { position: absolute; left: 44px; top: 44px; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #2a241d, #0c0a08); z-index: 1; }
  .dpad .arrow { position: absolute; z-index: 1; width: 0; height: 0; border: 5px solid transparent; pointer-events: none; }
  .dpad .arrow.u { left: 47px; top: 8px; border-bottom-color: rgba(243,181,68,0.55); }
  .dpad .arrow.d { left: 47px; bottom: 8px; border-top-color: rgba(243,181,68,0.55); }
  .dpad .arrow.l { top: 47px; left: 8px; border-right-color: rgba(240,223,184,0.2); }
  .dpad .arrow.r { top: 47px; right: 8px; border-left-color: rgba(240,223,184,0.2); }
  .dpad button { position: absolute; left: 35px; width: 34px; height: 36px; z-index: 2; }
  .dpad button.up { top: 0; }
  .dpad button.down { bottom: 0; }
  .dpad button.left, .dpad button.right { top: 35px; width: 36px; height: 34px; }
  .dpad button.left { left: 0; }
  .dpad button.right { left: auto; right: 0; }
  .dpad .arrow.l { border-right-color: rgba(243,181,68,0.55); }
  .dpad .arrow.r { border-left-color: rgba(243,181,68,0.55); }
  .dpad.press-up .cross { transform: perspective(200px) rotateX(10deg); }
  .dpad.press-down .cross { transform: perspective(200px) rotateX(-10deg); }
  .dpad.press-left .cross { transform: perspective(200px) rotateY(-10deg); }
  .dpad.press-right .cross { transform: perspective(200px) rotateY(10deg); }

  button.hit {
    background: transparent; border: 0; padding: 0; margin: 0;
    cursor: pointer; color: inherit; font: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  button.hit:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 50%; }

  .ab { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .ab.b { left: 214px; top: 436px; }
  .ab.a { left: 278px; top: 398px; }
  .cap {
    width: 50px; height: 50px; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #3d352c 0%, #1b1712 60%, #0f0c0a 100%);
    box-shadow:
      0 0 0 3px #a98c5c,
      0 0 0 4px rgba(255,255,255,0.45),
      0 4px 6px rgba(40,25,5,0.6),
      inset 0 1px 0 rgba(255,255,255,0.15);
    color: var(--amber);
    font-size: 15px; font-weight: 600;
    text-shadow: 0 0 8px rgba(243,181,68,0.7);
    transition: transform 80ms ease-out, box-shadow 80ms ease-out;
  }
  .hit:active .cap { transform: translateY(2px) scale(0.96); }
  .ab .lbl, .pills .lbl { font-size: 8.5px; letter-spacing: 1px; color: #6f5735; }

  .pills { position: absolute; top: 516px; left: 0; right: 0; display: flex; justify-content: center; gap: 30px; transform: translateX(-12px); }
  .pills .p { display: flex; flex-direction: column; align-items: center; gap: 6px; transform: rotate(-24deg); }
  .pills .bar {
    width: 46px; height: 11px; border-radius: 6px;
    background: linear-gradient(180deg, #3a332b, #15120f);
    box-shadow: 0 2px 2px rgba(40,25,5,0.5), 0 0 0 1px rgba(255,255,255,0.3);
    transition: transform 80ms ease-out;
  }
  .hit:active .bar { transform: translateY(1px); }

  .vents { position: absolute; right: 30px; bottom: 34px; display: flex; gap: 7px; transform: rotate(-28deg); }
  .vents i {
    width: 6px; height: 50px; border-radius: 3px;
    background: linear-gradient(180deg, #3a2a14, #1a120a);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.5);
  }
  .vents i:nth-child(2), .vents i:nth-child(4) {
    background: linear-gradient(180deg, #5a3d10, #2a1a08);
    box-shadow: inset 0 0 6px rgba(243,181,68,0.5), 0 1px 0 rgba(255,255,255,0.5);
  }

  .port { position: absolute; right: -4px; top: 170px; width: 6px; height: 120px; border-radius: 3px;
    background: repeating-linear-gradient(180deg, #2a1d0e 0 10px, var(--amber) 10px 14px);
    box-shadow: 0 0 14px rgba(243,181,68,0.55); opacity: 0.85; }

  /* detail overlay */
  #detailContainer {
    position: fixed; z-index: 10; overflow: hidden;
    opacity: 0; pointer-events: none;
    transition: left 500ms ease, top 500ms ease, width 500ms ease, height 500ms ease, opacity 250ms ease, border-radius 500ms ease;
    background: var(--umber);
    border-radius: 10px;
  }
  #detailFrame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

  @media (max-width: 640px) {
    .corner.br { display: none; }
    .corner.tl { top: 16px; left: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tilt, #detailContainer { transition: none !important; }
    .boot, .pill i, .boot .bar i { animation: none !important; }
    .boot .bar i { width: 100%; }
  }
</style>
</head>
<body>
<canvas id="fibers" aria-hidden="true"></canvas>

<div class="corner tl">
  <strong>Wyatt Voigt</strong>
  Computer engineering, Texas A&amp;M
</div>
<div class="corner br">
  <kbd>W</kbd><kbd>S</kbd> or <kbd>&uarr;</kbd><kbd>&darr;</kbd> choose &nbsp;
  <kbd>D</kbd> or <kbd>&rarr;</kbd> open &nbsp;
  <kbd>A</kbd> or <kbd>&larr;</kbd> back
</div>

<main class="stage">
  <div class="tilt" id="tilt">
    <div class="device" id="device">
      <div class="power"><i></i>POWER</div>

      <div class="bezel">
        <div class="screen" id="screenRect">
          <div class="scr-head">
            <div>
              <div class="scr-title">Wyatt Voigt</div>
              <div class="scr-sub">Computer Engineering, TAMU</div>
            </div>
            <span class="batt" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          </div>

          <div class="scr-body">
            <ul class="menu" id="menu" role="listbox" aria-label="Sections"></ul>
            <div class="stat">
              <span class="stat-label">Degree progress</span>
              <div class="ring">
                <svg viewBox="0 0 66 66" aria-hidden="true">
                  <circle cx="33" cy="33" r="27" fill="none" stroke="rgba(240,223,184,0.1)" stroke-width="6"/>
                  <circle id="ringArc" cx="33" cy="33" r="27" fill="none" stroke="#f3b544" stroke-width="6" stroke-linecap="round"
                          stroke-dasharray="169.6" stroke-dashoffset="169.6" style="filter: drop-shadow(0 0 3px rgba(243,181,68,.6)); transition: stroke-dashoffset 1.4s cubic-bezier(.2,.7,.2,1) .6s"/>
                </svg>
                <div class="num" id="ringNum">0%</div>
              </div>
              <div class="stat-foot"><b id="lastRole"></b><span id="lastCo"></span></div>
              <svg class="spark" viewBox="0 0 88 22" preserveAspectRatio="none" aria-hidden="true">
                <polyline id="spark" fill="none" stroke="#f3b544" stroke-width="1.2" stroke-linejoin="round" points=""/>
              </svg>
            </div>
          </div>

          <div class="scr-hint">
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0.8 9.4 9H0.6Z" fill="none" stroke="#f3b544" stroke-width="1.2" stroke-linejoin="round"/></svg>
            <span id="hint"></span>
          </div>

          <div class="boot" id="bootView">
            <span class="b1">Now loading</span>
            <span class="b2" id="bootRole"></span>
            <span class="b3" id="bootCompany"></span>
            <span class="b1" id="bootPeriod"></span>
            <span class="bar"><i></i></span>
          </div>
          <div class="flash" id="flashOverlay"></div>
        </div>
      </div>

      <div class="mark">Wyatt Voigt <span>Pocket</span></div>

      <div class="dpad" id="dpad">
        <div class="cross"></div>
        <div class="hub"></div>
        <span class="arrow u"></span><span class="arrow d"></span><span class="arrow l"></span><span class="arrow r"></span>
        <button class="hit up" data-dir="up" aria-label="Previous item"></button>
        <button class="hit down" data-dir="down" aria-label="Next item"></button>
        <button class="hit left" data-dir="left" aria-label="Go back"></button>
        <button class="hit right" data-dir="right" aria-label="Open selected"></button>
      </div>

      <button class="hit ab b" id="btnB" aria-label="B: go back"><span class="cap">B</span></button>
      <button class="hit ab a" id="btnA" aria-label="A: open selected"><span class="cap">A</span></button>

      <div class="pills">
        <div class="p"><span class="bar"></span><span class="lbl">SELECT</span></div>
        <button class="hit p" id="btnStart" aria-label="Start: open selected"><span class="bar"></span><span class="lbl">START</span></button>
      </div>

      <div class="vents"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="port" aria-hidden="true"></div>
    </div>
  </div>
</main>

<div id="detailContainer">
  <iframe id="detailFrame" title="Section detail"></iframe>
</div>

<script src="resume-data.js"></script>
<script>
(function () {
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var items = [
    { label: 'About', hint: 'Who I am and how to reach me', action: function () { openDetail('about.html'); } },
    { label: 'Projects', hint: 'Hackathon wins and things I have built', action: function () { openDetail('projects.html'); } },
    { label: 'Classes', hint: 'Coursework from high school to senior design', action: function () { openDetail('classes.html'); } },
    { label: 'Extracurriculars', hint: 'Clubs, competitions and hobbies', action: function () { openDetail('extracurriculars.html'); } },
    { label: 'Resume', ext: true, hint: 'Opens my resume as a PDF in a new tab', action: function () { window.open('resume.pdf', '_blank'); } },
    { label: 'GitHub', ext: true, hint: 'Opens github.com/WyattVO in a new tab', action: function () { window.open('https://github.com/WyattVO', '_blank'); } },
    { label: 'LinkedIn', ext: true, hint: 'Opens my LinkedIn profile in a new tab', action: function () { window.open('https://www.linkedin.com/in/wyatt-voigt-b72920385/', '_blank'); } }
  ];

  var selectedIndex = 0;
  var currentView = 'boot';
  var bootEnded = false;

  var tilt = document.getElementById('tilt');
  var screenRect = document.getElementById('screenRect');
  var detailContainer = document.getElementById('detailContainer');
  var detailFrame = document.getElementById('detailFrame');
  var bootView = document.getElementById('bootView');
  var flashOverlay = document.getElementById('flashOverlay');
  var menu = document.getElementById('menu');
  var hint = document.getElementById('hint');
  var dpad = document.getElementById('dpad');

  // ---------- menu ----------
  items.forEach(function (it, i) {
    var li = document.createElement('li');
    li.setAttribute('role', 'option');
    li.innerHTML = '<span>' + it.label + '</span>' + (it.ext ? '<span class="ext">&#8599;</span>' : '');
    li.addEventListener('click', function () {
      if (currentView === 'boot') { endBoot(); return; }
      if (currentView !== 'menu') return;
      selectedIndex = i;
      renderMenu();
      confirmSelection();
    });
    li.addEventListener('mouseenter', function () {
      if (currentView !== 'menu') return;
      selectedIndex = i;
      renderMenu();
    });
    menu.appendChild(li);
  });
  var rows = Array.prototype.slice.call(menu.children);

  function renderMenu() {
    rows.forEach(function (li, i) {
      li.classList.toggle('sel', i === selectedIndex);
      li.setAttribute('aria-selected', i === selectedIndex ? 'true' : 'false');
    });
    hint.textContent = items[selectedIndex].hint;
  }

  // ---------- screen data ----------
  (function renderStats() {
    var start = new Date(2023, 7, 15), end = new Date(2027, 4, 15), now = new Date();
    var pct = Math.max(0, Math.min(1, (now - start) / (end - start)));
    var c = 2 * Math.PI * 27;
    var arc = document.getElementById('ringArc');
    var num = document.getElementById('ringNum');
    var target = Math.round(pct * 100);
    setTimeout(function () { arc.style.strokeDashoffset = String(c * (1 - pct)); }, 50);
    if (reduceMotion) { num.textContent = target + '%'; }
    else {
      var t0 = null;
      setTimeout(function () {
        requestAnimationFrame(function step(ts) {
          if (!t0) t0 = ts;
          var k = Math.min(1, (ts - t0) / 1400);
          num.textContent = Math.round(target * (1 - Math.pow(1 - k, 3))) + '%';
          if (k < 1) requestAnimationFrame(step);
        });
      }, 600);
    }

    var exp = window.RESUME_DATA && window.RESUME_DATA.experience;
    var latest = exp && exp[0];
    if (latest) {
      document.getElementById('lastRole').textContent = latest.title;
      document.getElementById('lastCo').textContent = latest.company + ', ' + latest.period.replace(/\s*—\s*/, '–');
      document.getElementById('bootRole').textContent = latest.title;
      document.getElementById('bootCompany').textContent = '@ ' + latest.company;
      document.getElementById('bootPeriod').textContent = latest.period;
    }

    // a small signal trace, just for texture
    var pts = [], y = 14;
    for (var x = 0; x <= 88; x += 4) {
      y = Math.max(3, Math.min(19, y + (Math.random() - 0.55) * 6));
      pts.push(x + ',' + y.toFixed(1));
    }
    document.getElementById('spark').setAttribute('points', pts.join(' '));
  })();

  // ---------- actions ----------
  function flashScreen(cb) {
    flashOverlay.style.transition = 'none';
    flashOverlay.style.opacity = '0';
    requestAnimationFrame(function () {
      flashOverlay.style.transition = 'opacity 140ms ease-out';
      flashOverlay.style.opacity = '0.7';
      setTimeout(function () {
        flashOverlay.style.transition = 'opacity 140ms ease-in';
        flashOverlay.style.opacity = '0';
        setTimeout(cb, 140);
      }, 140);
    });
  }

  function pressDpad(dir) {
    dpad.classList.add('press-' + dir);
    setTimeout(function () { dpad.classList.remove('press-' + dir); }, 120);
  }

  function moveSelection(delta) {
    if (currentView !== 'menu') return;
    pressDpad(delta < 0 ? 'up' : 'down');
    selectedIndex = (selectedIndex + delta + items.length) % items.length;
    renderMenu();
  }

  function confirmSelection() {
    if (currentView !== 'menu') return;
    flashScreen(function () { items[selectedIndex].action(); });
  }

  function placeOverScreen() {
    var r = screenRect.getBoundingClientRect();
    detailContainer.style.left = r.left + 'px';
    detailContainer.style.top = r.top + 'px';
    detailContainer.style.width = r.width + 'px';
    detailContainer.style.height = r.height + 'px';
    detailContainer.style.borderRadius = '10px';
  }

  function openDetail(page) {
    currentView = 'detail';
    detailContainer.style.transition = 'none';
    placeOverScreen();
    detailContainer.style.opacity = '0';
    detailFrame.src = page;
    void detailContainer.offsetWidth;
    requestAnimationFrame(function () {
      detailContainer.style.transition = '';
      detailContainer.style.pointerEvents = 'auto';
      detailContainer.style.opacity = '1';
      detailContainer.style.left = '0px';
      detailContainer.style.top = '0px';
      detailContainer.style.width = '100vw';
      detailContainer.style.height = '100vh';
      detailContainer.style.borderRadius = '0px';
      tilt.style.opacity = '0';
    });
  }

  function goBack() {
    if (currentView !== 'detail') return;
    currentView = 'menu';
    try { detailFrame.blur(); } catch (e) {}
    window.focus();
    tilt.style.opacity = '1';
    detailContainer.style.opacity = '0';
    placeOverScreen();
    setTimeout(function () {
      detailContainer.style.pointerEvents = 'none';
      detailFrame.src = 'about:blank';
    }, 500);
  }
  window.__gbGoBack = goBack;

  function endBoot() {
    if (bootEnded) return;
    bootEnded = true;
    bootView.classList.add('hide');
    currentView = 'menu';
    renderMenu();
  }
  setTimeout(endBoot, reduceMotion ? 300 : 1700);
  bootView.addEventListener('click', endBoot);

  // W/S or up/down move, D or right opens, A or left goes back.
  // Enter/Space and Esc/Backspace/B still work too.
  var KEY_UP = ['arrowup', 'w'], KEY_DOWN = ['arrowdown', 's'];
  var KEY_OPEN = ['arrowright', 'd', 'enter', ' '];
  var KEY_BACK = ['arrowleft', 'a', 'escape', 'backspace', 'b'];

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (currentView === 'boot') { endBoot(); return; }
    var key = e.key.toLowerCase();
    var dir = KEY_UP.indexOf(key) >= 0 ? -1 : KEY_DOWN.indexOf(key) >= 0 ? 1 : 0;

    if (currentView === 'detail') {
      // the page inside the screen doesn't have focus yet, so scroll it from here
      if (dir) {
        e.preventDefault();
        try { detailFrame.contentWindow.scrollBy({ top: dir * 160, behavior: 'smooth' }); } catch (err) {}
      } else if (KEY_BACK.indexOf(key) >= 0) { e.preventDefault(); goBack(); }
      return;
    }

    if (dir) { e.preventDefault(); moveSelection(dir); }
    else if (KEY_OPEN.indexOf(key) >= 0) {
      if (key === ' ' && document.activeElement !== document.body) return;
      e.preventDefault();
      pressDpad('right');
      confirmSelection();
    }
    else if (KEY_BACK.indexOf(key) >= 0) { pressDpad('left'); goBack(); }
  });

  dpad.querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () {
      if (currentView === 'boot') { endBoot(); return; }
      var d = b.getAttribute('data-dir');
      if (d === 'up' || d === 'down') { moveSelection(d === 'up' ? -1 : 1); return; }
      pressDpad(d);
      if (d === 'right') confirmSelection(); else goBack();
    });
  });
  document.getElementById('btnA').addEventListener('click', function () {
    if (currentView === 'boot') { endBoot(); return; }
    confirmSelection();
  });
  document.getElementById('btnB').addEventListener('click', function () {
    if (currentView === 'boot') { endBoot(); return; }
    goBack();
  });
  document.getElementById('btnStart').addEventListener('click', function () {
    if (currentView === 'boot') { endBoot(); return; }
    confirmSelection();
  });

  // ---------- fit + pointer tilt ----------
  var baseRY = -16, baseRX = 5;
  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    var s = Math.min(1.15, (h - 90) / 640, (w - 32) / 400);
    tilt.style.setProperty('--s', Math.max(0.5, s).toFixed(3));
    if (w < 640) { baseRY = -8; baseRX = 3; } else { baseRY = -16; baseRX = 5; }
    tilt.style.setProperty('--ry', baseRY + 'deg');
    tilt.style.setProperty('--rx', baseRX + 'deg');
  }
  fit();
  window.addEventListener('resize', fit);

  if (!reduceMotion && window.matchMedia('(pointer: fine)').matches) {
    window.addEventListener('pointermove', function (e) {
      if (currentView === 'detail') return;
      var nx = e.clientX / window.innerWidth - 0.5;
      var ny = e.clientY / window.innerHeight - 0.5;
      tilt.style.setProperty('--ry', (baseRY + nx * 10).toFixed(2) + 'deg');
      tilt.style.setProperty('--rx', (baseRX - ny * 8).toFixed(2) + 'deg');
    });
  }

  renderMenu();
})();

// ---------- fiber-optic background ----------
(function () {
  var cv = document.getElementById('fibers');
  var ctx = cv.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W, H, dpr, strands = [], sparks = [], bokeh = [];

  // pre-rendered glow sprite, cheaper than shadowBlur per particle
  var glow = document.createElement('canvas');
  glow.width = glow.height = 64;
  (function () {
    var g = glow.getContext('2d');
    var grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(255,236,190,1)');
    grd.addColorStop(0.18, 'rgba(255,196,90,0.9)');
    grd.addColorStop(0.45, 'rgba(243,160,50,0.25)');
    grd.addColorStop(1, 'rgba(243,160,50,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, 64, 64);
  })();

  function rand(a, b) { return a + Math.random() * (b - a); }

  function build() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    strands = [];
    var count = W < 640 ? 48 : 90;
    for (var i = 0; i < count; i++) {
      var bundle = i % 2;
      strands.push({
        y0: H * (bundle ? 0.2 : 0.75) + rand(-H * 0.12, H * 0.12),
        y3: H * (bundle ? 0.55 : 0.45) + rand(-H * 0.08, H * 0.08),
        a1: rand(0.18, 0.32) * H * (bundle ? 1 : -1),
        a2: rand(0.18, 0.32) * H * (bundle ? -1 : 1),
        ph: rand(0, Math.PI * 2),
        sp: rand(0.15, 0.35),
        w: rand(0.4, 1.1),
        alpha: rand(0.12, 0.32)
      });
    }
    sparks = [];
    for (var j = 0; j < (W < 640 ? 26 : 55); j++) {
      sparks.push({ s: Math.floor(Math.random() * strands.length), t: Math.random(), v: rand(0.0006, 0.0022), r: rand(6, 16) });
    }
    bokeh = [];
    for (var k = 0; k < 9; k++) {
      var side = Math.random() < 0.5;
      bokeh.push({ x: side ? rand(0, W * 0.2) : rand(W * 0.8, W), y: rand(H * 0.55, H), r: rand(14, 46), a: rand(0.08, 0.25) });
    }
  }

  function pts(st, time) {
    var wob = Math.sin(time * st.sp + st.ph);
    return [
      -60, st.y0,
      W * 0.32, st.y0 + st.a1 + wob * 18,
      W * 0.68, st.y3 + st.a2 - wob * 18,
      W + 60, st.y3 + wob * 6
    ];
  }
  function at(p, t) {
    var u = 1 - t;
    return [
      u*u*u*p[0] + 3*u*u*t*p[2] + 3*u*t*t*p[4] + t*t*t*p[6],
      u*u*u*p[1] + 3*u*u*t*p[3] + 3*u*t*t*p[5] + t*t*t*p[7]
    ];
  }

  function frame(ms) {
    var time = ms / 1000;
    var bg = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
    bg.addColorStop(0, '#2b2017');
    bg.addColorStop(0.55, '#161009');
    bg.addColorStop(1, '#0a0705');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    var warm = ctx.createRadialGradient(0, H, 0, 0, H, W * 0.5);
    warm.addColorStop(0, 'rgba(214,140,90,0.28)');
    warm.addColorStop(1, 'rgba(214,140,90,0)');
    ctx.fillStyle = warm;
    ctx.fillRect(0, 0, W, H);

    var cache = new Array(strands.length);
    ctx.lineCap = 'round';
    for (var i = 0; i < strands.length; i++) {
      var st = strands[i], p = pts(st, time);
      cache[i] = p;
      ctx.beginPath();
      ctx.moveTo(p[0], p[1]);
      ctx.bezierCurveTo(p[2], p[3], p[4], p[5], p[6], p[7]);
      ctx.strokeStyle = 'rgba(236,214,170,' + st.alpha + ')';
      ctx.lineWidth = st.w;
      ctx.stroke();
    }

    ctx.globalCompositeOperation = 'lighter';
    for (var k = 0; k < bokeh.length; k++) {
      var b = bokeh[k];
      ctx.globalAlpha = b.a;
      ctx.drawImage(glow, b.x - b.r * 2, b.y - b.r * 2, b.r * 4, b.r * 4);
    }
    for (var j = 0; j < sparks.length; j++) {
      var s = sparks[j];
      if (!reduceMotion) { s.t += s.v; if (s.t > 1) { s.t = 0; s.s = Math.floor(Math.random() * strands.length); } }
      var q = at(cache[s.s], s.t);
      var fade = Math.sin(s.t * Math.PI);
      ctx.globalAlpha = 0.9 * fade;
      ctx.drawImage(glow, q[0] - s.r, q[1] - s.r, s.r * 2, s.r * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    if (!reduceMotion && !document.hidden) requestAnimationFrame(frame);
  }

  build();
  window.addEventListener('resize', function () { build(); if (reduceMotion) frame(0); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !reduceMotion) requestAnimationFrame(frame); });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
